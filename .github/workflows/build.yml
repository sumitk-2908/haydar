name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[dev,ocr]
      - name: Fetch ripgrep (verified)
        run: python scripts/pull-rg.py
      - name: Run tests
        run: pytest tests/ --cov=haydar --cov-fail-under=20

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .
          pip install pyinstaller
      - name: Fetch ripgrep (verified, bundled into EXE)
        run: python scripts/pull-rg.py
      - name: Build EXEs
        run: pyinstaller haydar.spec
      - name: Generate checksums
        run: |
          foreach ($name in @('haydar.exe', 'haydar-cli.exe')) {
            $hash = (Get-FileHash -Path "dist/$name" -Algorithm SHA256).Hash
            "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          }
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/haydar.exe
            dist/haydar.exe.sha256
            dist/haydar-cli.exe
            dist/haydar-cli.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
