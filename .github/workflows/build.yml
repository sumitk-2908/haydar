name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_upstream_pins:
        description: >-
          Re-download the pinned third-party assets from their real upstreams and
          check their SHA-256. Opt-in: it contacts live servers, so it must never
          run as part of the normal test suite.
        type: boolean
        default: false

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[dev,ocr] "pytest-qt>=4.0" "hypothesis>=6.0"
      - name: Fetch ripgrep (verified)
        run: python scripts/pull-rg.py
      - name: Lint
        run: ruff check src/ tests/
      - name: Type-check
        run: mypy src/haydar
      - name: Run tests
        run: pytest tests/ -m "not slow" --cov=haydar --cov-fail-under=65

  # Opt-in only (workflow_dispatch). No test in the normal suite may contact a
  # live upstream (§16), so the real release URLs and hashes are checked here
  # instead — before a release, deliberately, by a human who asked for it.
  verify-upstream-pins:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_upstream_pins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned third-party assets against their real upstreams
        run: python scripts/verify_upstream_pins.py

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[ocr]
          pip install pyinstaller
      - name: Fetch ripgrep (verified, bundled into EXE)
        run: python scripts/pull-rg.py
      - name: Build EXEs
        run: pyinstaller haydar.spec
      - name: Generate checksums
        run: |
          foreach ($name in @('haydar.exe', 'haydar-cli.exe')) {
            $hash = (Get-FileHash -Path "dist/$name" -Algorithm SHA256).Hash
            "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          }
      - name: Smoke-test built CLIs and release assets
        run: |
          & dist/haydar-cli.exe --version
          $ocrOutput = & dist/haydar-cli.exe ocr-status 2>&1
          $ocrOutput | Out-Host
          if ($ocrOutput -match "Python OCR adapter is not installed") { throw "Packaged CLI is missing pytesseract" }
          foreach ($asset in @('haydar.exe', 'haydar.exe.sha256', 'haydar-cli.exe', 'haydar-cli.exe.sha256')) {
            if (-not (Test-Path -LiteralPath "dist/$asset" -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          foreach ($script in @('install.ps1', 'uninstall.ps1', 'verify.ps1', 'THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "Missing release asset: $script" }
          }
          foreach ($script in @('install.ps1', 'uninstall.ps1', 'verify.ps1')) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script has PowerShell parse errors: $errors" }
          }
      # Release success is gated primarily on the packaged GUI starting (§15).
      # haydar.exe is windowed, so a missing hidden import or a console-less
      # startup fault prints nothing and would otherwise ship undetected. The
      # probe runs it against a throwaway profile and fails the build on any
      # defect it reports.
      - name: Probe packaged GUI startup (isolated profile)
        run: python scripts/packaged_startup_probe.py --exe dist/haydar.exe
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/haydar.exe
            dist/haydar.exe.sha256
            dist/haydar-cli.exe
            dist/haydar-cli.exe.sha256
            install.ps1
            uninstall.ps1
            verify.ps1
            THIRD_PARTY_NOTICES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: pip install mkdocs-material
      - name: Deploy documentation
        run: mkdocs gh-deploy --force
