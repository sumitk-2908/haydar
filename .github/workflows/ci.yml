name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: "0 2 * * *"

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[dev,ocr] "pytest-qt>=4.0" "hypothesis>=6.0"
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Type check with mypy
        run: mypy src/haydar

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[dev,ocr] "pytest-qt>=4.0" "hypothesis>=6.0"
      - name: Fetch ripgrep (verified)
        run: python scripts/pull-rg.py
      - name: Run tests
        run: pytest tests/ -m "not slow" --cov=haydar --cov-fail-under=65

  smoke-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          pip install -e .[ocr]
          pip install pyinstaller
      - name: Fetch ripgrep (verified, bundled into EXE)
        run: python scripts/pull-rg.py
      - name: Build EXEs
        run: pyinstaller haydar.spec
      - name: Verify packaged OCR adapter
        run: |
          $output = & dist/haydar-cli.exe ocr-status 2>&1
          $output | Out-Host
          if ($output -match "Python OCR adapter is not installed") { throw "Packaged CLI is missing pytesseract" }
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haydar-exe
          path: |
            dist/haydar.exe
            dist/haydar-cli.exe
          if-no-files-found: error

  nightly:
    runs-on: windows-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .[dev,ocr]
      - run: python scripts/pull-rg.py
      - run: pytest -m slow tests/test_scale.py -v
