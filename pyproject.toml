[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haydar"
dynamic = ["version"]
description = "Fast, local semantic file search for Windows. Find files by what they contain, not what they're named."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Haydar Team" },
]
keywords = ["search", "semantic", "files", "local", "windows", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "watchdog>=4.0.0",
    "chardet>=5.0.0",
    "pynput>=1.7.6",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
haydar = "haydar.cli:app"

[project.gui-scripts]
haydar-ui = "haydar.cli:launch_ui"

[project.urls]
Homepage = "https://github.com/haydar-search/haydar"
Documentation = "https://haydar.dev"
Repository = "https://github.com/haydar-search/haydar"
Issues = "https://github.com/haydar-search/haydar/issues"

[tool.hatch.version]
path = "src/haydar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haydar"]

# Note: ripgrep is NOT vendored in the wheel. For pip installs it is fetched
# (with SHA-256 verification) on first `haydar init`. The PyInstaller EXE bundles
# it at build time instead (see haydar.spec).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = ["attr-defined", "arg-type", "var-annotated", "dict-item", "misc", "union-attr", "assignment"]

